# Save this as .github/workflows/nyc_retail_chargers.yml in your repo,
# alongside nyc_retail_chargers.py at the repo root (adjust path if you
# put it elsewhere).

name: NYC Retail Chargers Pull

on:
  workflow_dispatch:      # manual "Run workflow" button
  schedule:
    - cron: "0 6 * * 1"   # every Monday 6am UTC — remove if you only want manual runs

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python nyc_retail_chargers.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyc-retail-chargers
          path: nyc_retail_chargers.csv
