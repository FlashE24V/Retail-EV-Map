<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>NY EV Retail Map (OCM CSV)</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
html,body{height:100%;margin:0;}
#map{height:100vh;width:100%;}

/* existing controls unchanged */
.controls{background:white;padding:8px 10px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.25);font:14px system-ui;}
.controls select{padding:6px;border-radius:8px;border:1px solid #ddd}

/* NEW location control */
.locateBox{
  background:white;
  padding:8px;
  border-radius:10px;
  box-shadow:0 1px 6px rgba(0,0,0,.25);
  display:flex;
  gap:6px;
  align-items:center;
}
.locateBox input{
  border:1px solid #ddd;
  padding:6px 8px;
  border-radius:8px;
  width:180px;
}
.locateBox button{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  background:#111;
  color:white;
  cursor:pointer;
}

.footer-attrib{
 position:fixed;left:0;right:0;bottom:0;z-index:9999;
 background:rgba(255,255,255,.92);
 border-top:1px solid rgba(0,0,0,.12);
 padding:6px 12px;font:12px system-ui;color:#374151;
 display:flex;justify-content:space-between
}
.leaflet-bottom{margin-bottom:28px;}
</style>
</head>

<body>
<div id="map"></div>

<div class="footer-attrib">
<div>Data from OpenChargeMap</div>
<div style="opacity:.8;">Retail EV charging locations</div>
</div>

<script>
// CONFIG
var OCM_CSV_URL='ocm_nyc_retail_locations.csv?v='+Date.now();
var NY_GEOJSON_URL='ny_state.geojson?v='+Date.now();

var map=L.map('map').setView([42.9,-75],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var clusterGroup=L.markerClusterGroup({disableClusteringAtZoom:17});
map.addLayer(clusterGroup);

// ================= USER LOCATION =================
var userLayer=L.layerGroup().addTo(map);

function setUserMarker(lat,lng,label){
 userLayer.clearLayers();
 var m=L.marker([lat,lng]).addTo(userLayer).bindPopup(label).openPopup();
 map.setView([lat,lng],14);
}

// GPS locate
function locateUser(){
 if(!navigator.geolocation){alert("No GPS support");return;}
 navigator.geolocation.getCurrentPosition(pos=>{
   setUserMarker(pos.coords.latitude,pos.coords.longitude,"You are here");
 },()=>alert("Location blocked"));
}

// address search ONLY
async function searchAddress(q){
 if(!q)return;
 var url=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`;
 var r=await fetch(url);
 var j=await r.json();
 if(!j.length){alert("Location not found");return;}
 setUserMarker(parseFloat(j[0].lat),parseFloat(j[0].lon),j[0].display_name);
}

// Leaflet control
L.control({position:'bottomleft'}).onAdd=function(){
 var div=L.DomUtil.create('div','locateBox');
 div.innerHTML=`
   <button id="gpsBtn">📍</button>
   <input id="searchBox" placeholder="Search address"/>
   <button id="goBtn">Go</button>`;
 L.DomEvent.disableClickPropagation(div);
 setTimeout(()=>{
   document.getElementById('gpsBtn').onclick=locateUser;
   document.getElementById('goBtn').onclick=()=>searchAddress(document.getElementById('searchBox').value);
 });
 return div;
}.addTo(map);

// ================= LOAD CSV =================
Papa.parse(OCM_CSV_URL,{
 download:true,header:true,dynamicTyping:true,
 complete:function(res){
   res.data.forEach(r=>{
     if(!r.lat||!r.lon)return;
     var m=L.marker([r.lat,r.lon]).bindPopup(r.name||"Charger");
     clusterGroup.addLayer(m);
   });
 }
});
</script>
</body>
</html>
