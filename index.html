<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NY EV Retail Map (OCM CSV)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100%; }

    .controls {
      background: white;
      padding: 8px 10px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.25);
      font: 14px system-ui, -apple-system, Arial, sans-serif;
    }

    .bolt-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #222;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      transform: translate(-1px, -1px);
      position: relative;
    }

    .bolt-l2 { background: #2563eb; }
    .bolt-l3 { background: #16a34a; }

    .op-badge {
      position: absolute;
      right: -8px;
      top: -8px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      border: 2px solid #fff;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .leaflet-div-icon { background: transparent; border: none; }

    /* ===== Footer Attribution ===== */
    .footer-attrib {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(0,0,0,0.12);
      padding: 6px 12px;
      font: 12px system-ui, -apple-system, Arial, sans-serif;
      color: #374151;
      display: flex;
      justify-content: space-between;
      backdrop-filter: blur(4px);
    }

    .footer-attrib a {
      color: #111;
      font-weight: 600;
      text-decoration: none;
    }

    .footer-attrib a:hover { text-decoration: underline; }

    .leaflet-bottom { margin-bottom: 28px; }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="footer-attrib">
    <div>Data from <a href="https://openchargemap.org" target="_blank">OpenChargeMap</a></div>
    <div>Retail EV charging locations</div>
  </div>

<script>
  var OCM_CSV_URL = 'ocm_nyc_retail_locations.csv?v=' + Date.now();

  var map = L.map('map').setView([40.7128, -74.0060], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var clusterGroup = L.markerClusterGroup({ disableClusteringAtZoom: 17 });
  map.addLayer(clusterGroup);

  function isDcFast(row){
    if(row.has_dc_fast === 1 || row.has_dc_fast === true) return true;
    var maxKw = parseFloat(row.max_kw);
    return !isNaN(maxKw) && maxKw >= 50;
  }

  function iconHTML(level){
    return '<div class="bolt-circle '+(level?'bolt-l3':'bolt-l2')+'">⚡</div>';
  }

  function popup(row){
    return '<b>'+ (row.name || 'EV Site') +'</b><br>' +
           (row.operator || '') + '<br>' +
           (row.address || '');
  }

  Papa.parse(OCM_CSV_URL,{
    download:true,
    header:true,
    dynamicTyping:true,
    complete:function(res){

      var bounds = [];

      res.data.forEach(function(row){
        if(!row.lat || !row.lon) return;

        var level = isDcFast(row);

        var marker = L.marker([row.lat,row.lon],{
          icon: L.divIcon({
            html: iconHTML(level),
            iconSize:[26,26],
            className:''
          })
        }).bindPopup(popup(row));

        clusterGroup.addLayer(marker);
        bounds.push([row.lat,row.lon]);
      });

      if(bounds.length) map.fitBounds(bounds,{padding:[30,30]});
    }
  });

</script>
</body>
</html>
